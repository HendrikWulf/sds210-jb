# Dependabot keeps the GitHub Actions in the workflows up to date.
# requirements.txt is not included on purpose: its pins mirror the tested sds210
# student environment and are updated together with it between semesters.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
