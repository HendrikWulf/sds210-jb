# Builds the book with Jupyter Book (MyST) and publishes it to GitHub Pages.
# Repository settings: Pages -> Build and deployment -> Source = "GitHub Actions".
name: Deploy book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # The site lives at https://<user>.github.io/<repository>/
  BASE_URL: /${{ github.event.repository.name }}
  # Keep in sync with requirements.txt and .github/workflows/build.yml
  JUPYTER_BOOK_VERSION: 2.1.7

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running deployment finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Pages
        uses: actions/configure-pages@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Jupyter Book
        run: npm install -g jupyter-book@${{ env.JUPYTER_BOOK_VERSION }}
      - name: Build HTML
        run: jupyter-book build --html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_build/html
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
