# Checks that the book still builds for every pull request into main.
# Uses the same toolchain as deploy.yml; notebooks are not executed.
name: Build book (PR check)

on:
  pull_request:
    branches: [main]

env:
  BASE_URL: /${{ github.event.repository.name }}
  # Keep in sync with requirements.txt and .github/workflows/deploy.yml
  JUPYTER_BOOK_VERSION: 2.1.7

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Catches mistakes in .github/solution-releases.toml before they reach main.
      - name: Check the solution release schedule
        run: python3 .github/scripts/release_solutions.py status
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Jupyter Book
        run: npm install -g jupyter-book@${{ env.JUPYTER_BOOK_VERSION }}
      - name: Build HTML
        run: jupyter-book build --html
