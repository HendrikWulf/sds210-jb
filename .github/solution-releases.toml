# Release schedule for the sample solutions of the practicals.
#
# The solutions live in the private repository HendrikWulf/sds210-solutions. The workflow
# .github/workflows/release-solutions.yml copies each one into this repository at its release
# time, adds it to the table of contents (myst.yml) and publishes the book.
# How it works and how to change it: .github/RELEASING-SOLUTIONS.md
#
# To change a date, edit `date` (YYYY-MM-DD, no quotes) and push to main.
# To release one practical at a different time of day, add for example  time = "12:00".
# Check the schedule locally with:
#   python3 .github/scripts/release_solutions.py status

# Swiss local time: Central European Time in winter, Central European Summer Time from the
# last Sunday of March. Changes between the two are handled automatically.
timezone = "Europe/Zurich"
release_time = "17:00"

# After the course, all released solutions are taken down again: removed from the repository
# and from the book (they remain in the repository's history). Must be after the last release.
takedown_date = 2027-07-01
takedown_time = "23:59"

# `notebook` is the solution notebook; its paired MyST file (same name, .md) is released with it.

